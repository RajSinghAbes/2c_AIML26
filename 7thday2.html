<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Parameter</title>
</head>

<body>

<script>

function sum(...numbers) {
    let total = 0;

    for (let number of numbers) {
        total = total + number;
    }

    console.log(total);
}

sum(10, 20);
sum(10, 20, 30);
sum(10, 20, 30, 40);

</script>

</body>
</html>
