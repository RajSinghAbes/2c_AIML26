<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function student</title>
    <script>
        function student(id,name,city){
            this.id=id;
            this.name=name;
            this.city=city;
        } 
        let st1=new student("101","Raj","kasia");
        let st2=new student("102","singh","kushinagar");
        console.log(st1.name);
        console.log(st1.id);
        console.log(st1.city);
        console.log(st2.name);
        console.log(st2.id);
        console.log(st2.city);




    </script>
</head>
